<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mxliff 编辑器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mxliff">
<meta name="theme-color" content="#1f5f8b">
<style>
/* Layout idea: one sticky toolbar, then a single column of segment rows — status gutter | source | target — like a bilingual galley proof. */
:root {
  --paper: #f3f5f7;
  --surface: #ffffff;
  --ink: #18222d;
  --muted: #5f6d7a;
  --line: #d5dbe1;
  --accent: #1f5f8b;
  --accent-soft: #e2eef6;
  --ok: #2e7d5b;
  --ok-soft: #e0f1e9;
  --warn: #a35a00;
  --warn-soft: #fbefd9;
  --tag: #6b4fa3;
  --tag-soft: #ece6f6;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181e; --surface: #1b232b; --ink: #e6ecf1; --muted: #93a1ae; --line: #2f3a45;
    --accent: #6fb3e0; --accent-soft: #1d3345; --ok: #5cc097; --ok-soft: #183428;
    --warn: #e5a54b; --warn-soft: #3a2c14; --tag: #b9a2e6; --tag-soft: #2b2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181e; --surface: #1b232b; --ink: #e6ecf1; --muted: #93a1ae; --line: #2f3a45;
  --accent: #6fb3e0; --accent-soft: #1d3345; --ok: #5cc097; --ok-soft: #183428;
  --warn: #e5a54b; --warn-soft: #3a2c14; --tag: #b9a2e6; --tag-soft: #2b2540;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: flex; flex-direction: column; height: 100%; }
.bar {
  flex: none; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-direction: column; gap: 10px;
}
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.file { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
.file-name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.file-meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; max-width: 320px; }
.progress > i { display: block; height: 100%; background: var(--ok); width: 0; }
.btn {
  min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 14px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); }
.search { flex: 1 1 200px; min-width: 0; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
.seg-control { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-control button { min-height: 40px; padding: 0 12px; border: 0; background: var(--surface); border-right: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.seg-control button:last-child { border-right: 0; }
.seg-control button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg-control .n { font-variant-numeric: tabular-nums; color: var(--muted); margin-left: 4px; font-weight: 400; }
.replace-row input { flex: 1 1 160px; min-width: 0; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }

.notice { margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice span { flex: 1 1 240px; }

.list { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 80px; display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

.seg {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px;
  display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); gap: 0 14px; padding: 12px 14px 10px 8px;
}
.seg.confirmed { border-left-color: var(--ok); }
.seg.modified { border-left-color: var(--accent); }
.seg.locked { opacity: .75; }
.gutter { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.confirm {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-size: 18px; color: transparent; padding: 0;
}
.seg.confirmed .confirm { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.confirm:disabled { cursor: default; }
.src { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; line-height: 1.6; padding-top: 6px; }
.src .nl, .src .tagm { font-family: var(--font-mono); font-size: 13px; }
.src .nl { color: var(--muted); opacity: .7; }
.tagm { color: var(--tag); background: var(--tag-soft); border-radius: 4px; padding: 0 3px; }
.src mark { background: transparent; color: inherit; border-bottom: 2px solid var(--accent); }
.col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.grow { display: grid; }
.grow::after { content: attr(data-v) " "; visibility: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.grow > textarea, .grow::after {
  grid-area: 1 / 1; font: inherit; font-size: 17px; line-height: 1.6; padding: 6px 10px; border: 1px solid transparent; border-radius: 6px; min-width: 0;
}
.grow > textarea { resize: none; overflow: hidden; background: var(--paper); color: var(--ink); border-color: var(--line); width: 100%; }
.grow > textarea:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.grow > textarea[readonly] { background: transparent; border-style: dashed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 13px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); line-height: 1.5; }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.info { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
button.chip.term { color: var(--ink); min-height: 30px; }
button.chip.term.used { color: var(--ok); border-color: var(--ok); }
button.chip.tagbtn { font-family: var(--font-mono); color: var(--tag); background: var(--tag-soft); border-color: transparent; min-height: 30px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.meta .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 2px; margin-left: auto; }
.detail { grid-column: 2 / -1; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.detail dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.detail .key { font-family: var(--font-mono); font-size: 13px; }
.alt { display: flex; gap: 8px; align-items: flex-start; }
.alt p { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.more { align-self: center; }

@media (max-width: 720px) {
  .seg { grid-template-columns: 48px minmax(0, 1fr); }
  .seg > .col.tgt { grid-column: 2; margin-top: 8px; }
  .detail { grid-column: 2; }
}

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(680px, calc(100% - 32px)); max-height: calc(100% - 48px); }
dialog::backdrop { background: rgba(10, 16, 22, .45); }
.dlg { display: flex; flex-direction: column; max-height: inherit; }
.dlg h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.dlg header, .dlg footer { padding: 14px 18px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dlg header { border-bottom: 1px solid var(--line); }
.dlg footer { border-top: 1px solid var(--line); justify-content: flex-end; }
.dlg .body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg .body p { margin: 0; }
.dlg dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.dlg dt { font-weight: 600; font-size: 14px; color: var(--muted); }
.dlg dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }
.field { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.field input { min-height: 40px; width: 90px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
.hint { color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 15px; max-width: calc(100% - 32px); z-index: 10; }
@media (prefers-reduced-motion: no-preference) { .progress > i { transition: width .2s; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="bar-row">
      <div class="file">
        <div class="file-name" id="fileName">未打开文件</div>
        <div class="file-meta" id="fileMeta"></div>
        <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
      </div>
      <button class="btn" id="btnOpen" type="button">打开文件</button>
      <button class="btn" id="btnGloss" type="button">术语表</button>
      <button class="btn" id="btnInfo" type="button">项目说明</button>
      <button class="btn primary" id="btnExport" type="button">导出</button>
    </div>
    <div class="bar-row">
      <input class="search" id="search" type="search" placeholder="搜索原文、译文或 key" autocomplete="off">
      <div class="seg-control" id="filters" role="group" aria-label="筛选句段">
        <button type="button" data-f="all" aria-pressed="true">全部<span class="n"></span></button>
        <button type="button" data-f="todo" aria-pressed="false">未确认<span class="n"></span></button>
        <button type="button" data-f="mod" aria-pressed="false">已修改<span class="n"></span></button>
        <button type="button" data-f="warn" aria-pressed="false">有提示<span class="n"></span></button>
      </div>
      <button class="btn" id="btnReplace" type="button" aria-expanded="false">替换</button>
    </div>
    <div class="bar-row replace-row" id="replaceRow" hidden>
      <input id="repFind" type="text" placeholder="查找译文中的文字" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input id="repWith" type="text" placeholder="替换为" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="btnRepAll" type="button">在当前列表中全部替换</button>
    </div>
  </div>
  <div class="notice" id="demoNotice" hidden><span>现在显示的是内置示例文件，内容是虚构的。打开你自己的 mxliff 开始工作，文件只在这台设备上处理。</span><button class="btn small" type="button" id="btnOpen2">打开文件</button></div>
  <div class="list" id="list"></div>
</div>

<input type="file" id="fileInput" hidden>
<input type="file" id="glossInput" hidden>

<dialog id="dlgInfo"><div class="dlg">
  <header><h2>项目说明</h2><button class="btn small" type="button" data-close>关闭</button></header>
  <div class="body" id="infoBody"></div>
</div></dialog>

<dialog id="dlgGloss"><div class="dlg">
  <header><h2>术语表</h2><button class="btn small" type="button" data-close>关闭</button></header>
  <div class="body">
    <p id="glossState"></p>
    <p class="hint">支持 CSV、TSV（第一列原文，第二列译文，第三列备注可选）和 TBX。Excel 表格请先另存为 CSV。术语表保存在这台设备的浏览器里，不会上传。</p>
  </div>
  <footer><button class="btn" type="button" id="btnGlossClear">清除</button><button class="btn primary" type="button" id="btnGlossLoad">载入术语表</button></footer>
</div></dialog>

<dialog id="dlgExport"><div class="dlg">
  <header><h2>导出</h2><button class="btn small" type="button" data-close>关闭</button></header>
  <div class="body">
    <p id="exportSummary"></p>
    <div class="field"><label for="confValue">确认句段时写入的 m:confirmed 值</label><input id="confValue" type="text" inputmode="numeric" autocomplete="off"></div>
    <p class="hint" id="confHint"></p>
    <p class="hint" id="exportHow"></p>
  </div>
  <footer><button class="btn" type="button" id="btnCopyAll">复制全文</button><button class="btn" type="button" id="btnZip" hidden>存为 zip</button><button class="btn" type="button" id="btnShare" hidden>存到“文件”</button><button class="btn primary" type="button" id="btnDoExport">保存文件</button></footer>
</div></dialog>

<dialog id="dlgAsk"><div class="dlg">
  <header><h2 id="askTitle"></h2></header>
  <div class="body"><p id="askText"></p></div>
  <footer><button class="btn" type="button" id="askNo">取消</button><button class="btn primary" type="button" id="askYes">继续</button></footer>
</div></dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script id="core">
/* Core: text-level MXLIFF parsing and write-back. Only <target> content and m:confirmed are ever rewritten. */
const Core = (() => {
  const NAMED = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function decode(s) {
    return s.replace(/&(#[xX][0-9a-fA-F]+|#\d+|[a-zA-Z]+);/g, (m, e) => {
      if (e[0] === '#') {
        const cp = (e[1] === 'x' || e[1] === 'X') ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        try { return String.fromCodePoint(cp); } catch (_) { return m; }
      }
      return Object.prototype.hasOwnProperty.call(NAMED, e) ? NAMED[e] : m;
    });
  }
  function encode(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\r/g, '&#13;').replace(/\n/g, '&#10;').replace(/\t/g, '&#9;');
  }
  function attr(attrs, name) {
    const re = new RegExp('(^|\\s)' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*=\\s*(["\'])([\\s\\S]*?)\\2');
    const m = re.exec(attrs);
    if (!m) return null;
    const valStart = m.index + m[0].length - 1 - m[3].length;
    return { value: decode(m[3]), start: valStart, end: valStart + m[3].length };
  }
  function parse(text) {
    const rootM = /<xliff\b([^>]*)>/.exec(text);
    if (!rootM) throw new Error('这不是 XLIFF/MXLIFF 文件：找不到 <xliff> 根元素。');
    const fileM = /<file\b([^>]*)>/.exec(text);
    const fa = fileM ? fileM[1] : '';
    const val = (a, n) => { const r = attr(a, n); return r ? r.value : ''; };
    const info = {
      level: val(rootM[1], 'm:level'), original: val(fa, 'original'),
      srcLang: val(fa, 'source-language'), tgtLang: val(fa, 'target-language'),
      jobUid: val(fa, 'm:job-uid'), taskId: val(fa, 'm:task-id')
    };
    const units = [];
    const openRe = /<trans-unit\b([^>]*)>/g;
    let m, prevEnd = 0, prevCtx = {};
    while ((m = openRe.exec(text))) {
      const openStart = m.index, attrs = m[1], attrsStart = openStart + '<trans-unit'.length;
      const bodyStart = openStart + m[0].length;
      const closeAt = text.indexOf('</trans-unit>', bodyStart);
      if (closeAt < 0) throw new Error('文件结构不完整：有一个 <trans-unit> 没有结束标签。');
      const body = text.slice(bodyStart, closeAt);
      // context of the enclosing group
      let ctx = prevCtx;
      const g = text.lastIndexOf('<group', openStart);
      if (g >= prevEnd) {
        ctx = {};
        const seg = text.slice(g, openStart);
        const cre = /<context(?=[\s>])([^>]*)>([\s\S]*?)<\/context>/g; let c;
        while ((c = cre.exec(seg))) { const t = attr(c[1], 'context-type'); if (t) ctx[t.value] = decode(c[2]); }
      }
      // alt-trans ranges are skipped when looking for this unit's own source/target
      const alts = [], altRanges = [];
      const are = /<alt-trans\b([^>]*)>([\s\S]*?)<\/alt-trans>/g; let a;
      while ((a = are.exec(body))) {
        altRanges.push([a.index, a.index + a[0].length]);
        const tm = /<target\b[^>]*>([\s\S]*?)<\/target>/.exec(a[2]);
        const o = attr(a[1], 'origin'), q = attr(a[1], 'match-quality');
        if (tm && tm[1].indexOf('<') < 0 && decode(tm[1]).trim()) alts.push({ origin: o ? o.value : '', quality: q ? q.value : '', text: decode(tm[1]) });
      }
      const inAlt = i => altRanges.some(r => i >= r[0] && i < r[1]);
      const find = re => { let x; re.lastIndex = 0; while ((x = re.exec(body))) { if (!inAlt(x.index)) return x; } return null; };
      const sm = find(/<source\b[^>]*?(?:\/>|>([\s\S]*?)<\/source>)/g);
      const tm = find(/<target\b([^>]*?)(?:\/>|>([\s\S]*?)<\/target>)/g);
      const u = {
        idx: units.length, id: val(attrs, 'id'), attrsStart, attrsLen: attrs.length,
        src: sm && sm[1] != null ? decode(sm[1]) : '', key: ctx['x-key'] || '', note: ctx['x-key-note'] || '',
        locked: val(attrs, 'm:locked') === 'true', score: val(attrs, 'm:score'), origin: val(attrs, 'm:trans-origin'),
        alts, readonly: ''
      };
      const conf = attr(attrs, 'm:confirmed');
      u.confOrig = conf ? conf.value : null;
      u.confRange = conf ? [attrsStart + conf.start, attrsStart + conf.end] : null;
      if (tm) {
        const abs = bodyStart + tm.index;
        if (tm[2] != null) {
          const innerStart = abs + tm[0].length - '</target>'.length - tm[2].length;
          u.tgtKind = 'full'; u.tgtRange = [innerStart, innerStart + tm[2].length]; u.tgtOrig = decode(tm[2]);
          if (tm[2].indexOf('<') >= 0) u.readonly = '译文里含有内嵌 XML 元素，为保证结构安全不在这里编辑';
        } else {
          u.tgtKind = 'self'; u.tgtRange = [abs, abs + tm[0].length]; u.tgtAttrs = tm[1].replace(/\s+$/, ''); u.tgtOrig = '';
        }
      } else if (sm) {
        const p = bodyStart + sm.index + sm[0].length;
        u.tgtKind = 'none'; u.tgtRange = [p, p]; u.tgtOrig = '';
      } else {
        u.tgtKind = 'none'; u.tgtRange = null; u.tgtOrig = ''; u.readonly = '这个句段没有原文';
      }
      if (sm && sm[1] != null && sm[1].indexOf('<') >= 0) u.readonly = u.readonly || '原文里含有内嵌 XML 元素，为保证结构安全不在这里编辑';
      if (u.locked) u.readonly = u.readonly || '句段已锁定';
      units.push(u);
      prevEnd = closeAt; prevCtx = ctx; openRe.lastIndex = closeAt;
    }
    return { info, units };
  }
  const norm = s => s.replace(/\r\n?/g, '\n');
  /* edits: Map(idx -> {t?: string, c?: string}). Returns the new file text. */
  function build(text, units, edits) {
    const reps = [];
    edits.forEach((e, idx) => {
      const u = units[idx]; if (!u) return;
      if (e.t != null && u.tgtRange && !u.readonly && norm(e.t) !== norm(u.tgtOrig)) {
        const enc = encode(e.t);
        if (u.tgtKind === 'full') reps.push([u.tgtRange[0], u.tgtRange[1], enc]);
        else if (u.tgtKind === 'self') reps.push([u.tgtRange[0], u.tgtRange[1], '<target' + u.tgtAttrs + '>' + enc + '</target>']);
        else reps.push([u.tgtRange[0], u.tgtRange[1], '\n<target>' + enc + '</target>']);
      }
      if (e.c != null && e.c !== u.confOrig) {
        if (u.confRange) reps.push([u.confRange[0], u.confRange[1], encode(e.c)]);
        else { const p = u.attrsStart + u.attrsLen; reps.push([p, p, ' m:confirmed="' + encode(e.c) + '"']); }
      }
    });
    reps.sort((a, b) => a[0] - b[0]);
    const out = []; let pos = 0;
    for (const r of reps) { out.push(text.slice(pos, r[0]), r[2]); pos = r[1]; }
    out.push(text.slice(pos));
    return out.join('');
  }
  const TAG_RE = /\{\d+>|<\d+\}|\{\d+\}|\{[a-z^_]{1,2}>|<[a-z^_]{1,2}\}/g;
  const tags = s => s.match(TAG_RE) || [];
  function tagDiff(src, tgt) {
    const count = new Map();
    for (const t of tags(src)) count.set(t, (count.get(t) || 0) + 1);

      }
    }
    toast('后面没有未确认的句段了');
  }
  function updateCounts() {
    let conf = 0, mod = 0, warn = 0;
    for (const u of S.units) { if (isConf(u)) conf++; if (isMod(u)) mod++; if (warnings(u).length) warn++; }
    const n = S.units.length;
    $('fileMeta').textContent = (S.info.srcLang || '?') + ' → ' + (S.info.tgtLang || '?') + ' · 已确认 ' + conf + ' / ' + n + (mod ? ' · 已修改 ' + mod : '');
    $('progressBar').style.width = (n ? conf / n * 100 : 0) + '%';
    const counts = { all: n, todo: n - conf, mod, warn };
    $('filters').querySelectorAll('button').forEach(b => { b.querySelector('.n').textContent = counts[b.dataset.f]; b.setAttribute('aria-pressed', String(b.dataset.f === S.filter)); });
  }

  /* ---------- export ---------- */
  let downloads = null;
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  function openExport() {
    let mod = 0; for (const u of S.units) if (isMod(u)) mod++;
    $('exportSummary').textContent = mod ? '将写回 ' + mod + ' 个句段的修改。其余内容与原文件逐字相同。' : '没有修改，导出的文件与原文件完全相同。';
    $('confValue').value = S.confValue;
    $('confHint').textContent = '按 Phrase 的文档，这个值是确认时所在的工作流层级。这个文件的层级是 ' + (S.info.level || '未标明') + '，已确认句段用的是 ' + (S.units.find(u => u.confOrig && u.confOrig !== '0') || { confOrig: '—' }).confOrig + '。一般不用改。';
    $('btnZip').hidden = !downloads; $('btnDoExport').textContent = downloads ? '存为 txt' : '保存文件';
    let canShare = false;
    try { canShare = !downloads && !!navigator.canShare && navigator.canShare({ files: [new File(['x'], S.name, { type: 'text/xml' })] }); } catch (_) {}
    $('btnShare').hidden = !canShare;
    $('exportHow').textContent = downloads ? 'txt 的内容与 mxliff 逐字相同，文件名是“原名.mxliff.txt”，在“文件”里把末尾的 .txt 删掉就是 mxliff。也可以存为 zip 后解压，或复制全文粘贴到原文件里。' : canShare ? '“存到‘文件’”会打开系统的分享面板，选“存储到‘文件’”就能挑位置；“保存文件”直接存到“下载”。两种都用原文件名。' : '文件会以原文件名保存到“下载”。';
    $('dlgExport').showModal();
  }
  async function doExport(mode) {
    const nv = $('confValue').value.trim();
    if (nv && nv !== '0' && nv !== S.confValue) {
      const old = S.confValue; S.confValue = nv;
      S.edits.forEach((e, idx) => { if (e.c === old) setEdit(S.units[idx], { c: nv }); });
    }
    let out;
    try {
      out = Core.build(S.text, S.units, S.edits);
      // self-check: the rebuilt file must parse back to exactly what is on screen
      const back = Core.parse(out);
      if (back.units.length !== S.units.length) throw new Error('句段数量对不上');
      for (const u of S.units) {
        const b = back.units[u.idx];
        if (Core.norm(b.tgtOrig) !== Core.norm(u.readonly ? u.tgtOrig : tgtOf(u)) || b.src !== u.src || (b.confOrig || null) !== (confOf(u) || null)) throw new Error('第 ' + (u.idx + 1) + ' 句回读不一致');
      }
    } catch (e) { toast('导出前自检没有通过（' + e.message + '），文件没有保存。', 6000); return; }
    const u8 = new TextEncoder().encode(out);
    try {
      if (mode === 'copy') {
        await navigator.clipboard.writeText(out);
        $('dlgExport').close(); toast('已通过自检，全文已复制'); return;
      }
      if (mode === 'share') {
        await navigator.share({ files: [new File([u8], S.name, { type: 'text/xml' })] });
        $('dlgExport').close(); toast('已通过自检并交给系统保存'); return;
      }
      if (downloads && mode === 'zip') {
        await downloads.save({ filename: S.name.replace(/\.[^.]*$/, '') + '.zip', data: new Blob(Core.zipParts(S.name, u8)) });
      } else if (downloads) {
        await downloads.save({ filename: S.name + '.txt', data: new Blob([u8]) });
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: 'application/octet-stream' })); a.download = S.name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      }
      $('dlgExport').close(); toast('已通过自检并保存');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      toast(mode === 'copy' ? '复制没有成功，请改用保存。' : e && e.code === 'declined' ? '已取消保存。' : '保存失败：' + ((e && (e.message || e.code)) || '未知原因'), 5000);
    }
  }

  /* ---------- wiring ---------- */
  $('btnOpen').onclick = $('btnOpen2').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f); };
  let searchTimer = 0;
  $('search').oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.query = e.target.value; renderList(); }, 200); };
  $('filters').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.filter = b.dataset.f; renderList(); updateCounts(); };
  $('btnReplace').onclick = () => { const r = $('replaceRow'); r.hidden = !r.hidden; $('btnReplace').setAttribute('aria-expanded', String(!r.hidden)); if (!r.hidden) $('repFind').focus(); };
  $('btnRepAll').onclick = async () => {
    const find = $('repFind').value, rep = $('repWith').value; if (!find) { toast('先填要查找的文字'); return; }
    const hits = S.visible.filter(u => !u.readonly && tgtOf(u).includes(find));
    if (!hits.length) { toast('当前列表的译文里没有找到“' + find + '”'); return; }
    if (!(await ask('全部替换？', '将在 ' + hits.length + ' 个句段的译文里把“' + find + '”替换为“' + rep + '”。区分大小写。', '替换'))) return;
    for (const u of hits) setEdit(u, { t: tgtOf(u).split(find).join(rep) });
    renderList(); updateCounts(); toast('已替换 ' + hits.length + ' 个句段');
  };
  $('btnInfo').onclick = () => {
    const b = $('infoBody'); b.textContent = '';
    const dl = el('dl');
    const add = (k, v) => { const w = el('div'); w.appendChild(el('dt', '', k)); w.appendChild(el('dd', '', v)); dl.appendChild(w); };
    if (S.info.original) add('原始文件', S.info.original);
    add('语言', (S.info.srcLang || '?') + ' → ' + (S.info.tgtLang || '?'));
    if (S.info.level) add('工作流层级', S.info.level);
    for (const f of S.common) add(f.k, f.v);
    b.appendChild(dl);
    if (!S.common.length) b.appendChild(el('p', 'hint', '这个文件没有所有句段共用的备注。每句自己的备注在句段的“详情”里。'));
    $('dlgInfo').showModal();
  };
  $('btnGloss').onclick = () => { showGlossState(); $('dlgGloss').showModal(); };
  $('btnGlossLoad').onclick = () => $('glossInput').click();
  $('btnGlossClear').onclick = () => { S.gloss = null; buildGlossIdx(); store.del('gloss'); showGlossState(); renderList(); };
  $('glossInput').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const text = new TextDecoder('utf-8').decode(await f.arrayBuffer()).replace(/^\uFEFF/, '');
      const entries = /^\s*</.test(text) ? parseTbx(text) : parseDelimited(text);
      if (!entries.length) throw new Error('没有读到术语。请确认第一列是原文、第二列是译文。');
      S.gloss = { name: f.name, entries }; buildGlossIdx(); store.set('gloss', S.gloss); showGlossState(); renderList();
      toast('已载入 ' + entries.length + ' 条术语');
    } catch (err) { toast(err.message || '术语表读取失败', 5000); }
  };
  $('btnExport').onclick = openExport;
  $('btnDoExport').onclick = () => doExport('file');
  $('btnZip').onclick = () => doExport('zip');
  $('btnShare').onclick = () => doExport('share');
  $('btnCopyAll').onclick = () => doExport('copy');
  document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => b.closest('dialog').close(); });

  /* offline: when hosted as a normal site, a service worker keeps the app available without a network */
  if ('serviceWorker' in navigator && !(window.claude && window.claude.use) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------- start: restore the last session, else show the built-in example ---------- */
  function demoText() {
    const rows = [
      ['示例_0001', '新版本现已上线\n快来体验全新内容', 'The new version is live\nCome and try the new content', '2'],
      ['示例_0002', '完成任务可获得 {1>100 枚金币<1}', 'Complete the quest to earn {1>100 gold coins<1}', '2'],
      ['示例_0003', '活动将于周五结束', 'The event ends on Friday。', '0'],
      ['示例_0004', '点击此处领取奖励', '', '0']
    ];
    return '<?xml version="1.0" encoding="UTF-8"?>\n<xliff xmlns:m="http://www.memsource.com/mxlf/2.0" xmlns="urn:oasis:names:tc:xliff:document:1.2" version="1.2" m:version="2.17" m:level="2">\n<file original="示例.xlsx" source-language="zh-cn" target-language="en-us" datatype="x-undefined">\n<body>\n' +
      rows.map((r, i) => '<group id="' + i + '" m:para-id="' + i + '">\n<context-group>\n<context context-type="x-key">' + r[0] + '</context>\n<context context-type="x-key-note">【speaker】None&#10;【translation guide】&#10;这是虚构的示例说明：译文使用英文标点。&#10;</context>\n</context-group>\n<trans-unit id="demo:' + i + '" m:para-id="' + i + '" xml:space="preserve" m:score="0" m:gross-score="0" m:trans-origin="null" m:confirmed="' + r[3] + '" m:locked="false">\n<source>' + Core.encode(r[1]) + '</source>\n<target>' + Core.encode(r[2]) + '</target>\n</trans-unit>\n</group>\n').join('') +
      '</body>\n</file>\n</xliff>\n';
  }
  (async () => {
    load('示例.mxliff', demoText(), [], true);
    let [file, edits, gloss] = await Promise.all([store.get('file'), store.get('edits'), store.get('gloss')]);
    try { const ls = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (ls && Array.isArray(ls.edits) && (!edits || (ls.at || 0) > (edits.at || 0))) edits = ls; } catch (_) {}
    if (gloss && gloss.entries) { S.gloss = gloss; buildGlossIdx(); }
    if (file && file.text) {
      try {
        const mine = edits && edits.name === file.name ? edits : null;
        load(file.name, file.text, mine ? mine.edits : [], false);
        if (mine && mine.confValue) S.confValue = mine.confValue;
        if (mine && mine.edits.length) toast('已恢复上次的草稿：' + mine.edits.length + ' 个句段有修改');
        return;
      } catch (_) { /* fall through to the example */ }
    }
    if (S.glossIdx) renderList();
  })();
})();
</script>
</body>
